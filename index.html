<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WishiCloud – Min ønskeliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="nav">
    <div class="logo">☁️ WishiCloud</div>
    <button class="share" id="share">Del ønskelisten ↗</button>
  </div>
  <h1 id="title"></h1>
  <p>Ønsker gemmes, ikke glemmes. Find gaverne i butikkerne med det samme.</p>
  <svg class="clouds" viewBox="0 0 1440 110" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#ECF4FF" d="M0,70 C120,20 240,20 360,60 C480,10 600,10 720,50 C840,10 960,20 1080,55 C1200,20 1320,30 1440,70 L1440,110 L0,110 Z"/>
  </svg>
</header>

<main id="sections"></main>

<footer>WishiCloud · Lavet med ❤️ til jul og fødselsdage</footer>

<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="shops">
  <h3 id="shops-title"></h3>
  <p class="hint">Din browser blokerede nogle faner. Klik på butikkerne herunder, eller tillad pop-ups for siden.</p>
  <ul id="shops-list"></ul>
  <form method="dialog"><button class="close">Luk</button></form>
</dialog>

<script src="wishes.js"></script>
<script src="app.js"></script>
</body>
</html>
