<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WishiCloud – POC C (Konfetti)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FFF6E9; --ink:#172232; --coral:#FF7A59; --blue:#4397FF; --sun:#FFD166; --mint:#06D6A0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--cream);
    font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .hero {
    position: relative; overflow: hidden; text-align: center; padding: 60px 20px 70px;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,209,102,.7) 0 110px, transparent 111px),
      radial-gradient(circle at 88% 30%, rgba(6,214,160,.45) 0 140px, transparent 141px),
      radial-gradient(circle at 70% 90%, rgba(255,122,89,.35) 0 120px, transparent 121px);
  }
  .brand { font-family: Fredoka, "Varela Round", ui-rounded, system-ui, sans-serif; font-weight: 700; font-size: 22px; }
  .brand b { color: var(--coral); }
  h1 {
    font-family: Fredoka, "Varela Round", ui-rounded, system-ui, sans-serif; font-weight: 700;
    font-size: clamp(46px, 8vw, 92px); line-height: 1; margin: 22px 0 14px; letter-spacing: -.01em;
  }
  h1 span { display: inline-block; }
  h1 .c1 { color: var(--coral); } h1 .c2 { color: var(--blue); } h1 .c3 { color: var(--mint); }
  .hero p { max-width: 520px; margin: 0 auto; font-size: 19px; line-height: 1.5; }
  .sticker { position: absolute; font-size: 44px; animation: bob 4s ease-in-out infinite; }
  .s1 { left: 8%; top: 18%; } .s2 { right: 9%; top: 14%; animation-delay: -1.5s; } .s3 { right: 16%; bottom: 14%; animation-delay: -2.5s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .sticker { animation: none; } }

  main { max-width: 1100px; margin: 0 auto; padding: 10px 20px 60px; columns: 2 380px; column-gap: 22px; }
  .cat {
    break-inside: avoid; margin-bottom: 22px; background: #fff; border-radius: 28px; overflow: hidden;
    box-shadow: 0 2px 0 rgba(23,34,50,.06), 0 14px 30px rgba(23,34,50,.08);
  }
  .cat-head {
    padding: 18px 22px; color: #fff; display: flex; align-items: center; gap: 12px;
    font-family: Fredoka, "Varela Round", ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 24px;
  }
  .cat-head .n { margin-left: auto; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.25); border-radius: 999px; padding: 4px 10px; }
  .items { padding: 14px; display: grid; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 18px; background: var(--cream);
    transform: rotate(-.6deg); transition: transform .2s;
  }
  .item:nth-child(even) { transform: rotate(.6deg); }
  .item:hover { transform: rotate(0) scale(1.02); }
  .bubble {
    flex: 0 0 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; background: #fff;
    box-shadow: 0 4px 10px rgba(23,34,50,.12);
  }
  .item .t { flex: 1; min-width: 0; }
  .item h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .item p { margin: 2px 0 0; font-size: 14px; color: #5b6472; }
  .go {
    flex: 0 0 auto; text-decoration: none; color: #fff; font-weight: 600; font-size: 13px;
    background: var(--ink); border-radius: 999px; padding: 9px 14px;
  }
  footer { text-align: center; padding: 10px 20px 48px; font-size: 14px; color: #5b6472; }
  .share {
    position: fixed; right: 18px; bottom: 18px; font: 600 14px Geist, system-ui, sans-serif; color: #fff;
    background: var(--coral); border: 0; border-radius: 999px; padding: 12px 18px; box-shadow: 0 8px 20px rgba(255,122,89,.4); cursor: pointer;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="brand">☁ Wish<b>i</b>Cloud</div>
  <h1><span class="c1">Min</span> <span class="c2">ønske</span> <span class="c3">liste</span></h1>
  <p>Ønsker gemmes, ikke glemmes. Klik rundt, find gaverne og del linket med familien!</p>
  <div class="sticker s1">🎁</div>
  <div class="sticker s2">✨</div>
  <div class="sticker s3">🎈</div>
</header>

<main id="sections"></main>

<footer>WishiCloud · Lavet med ❤️ og lidt konfetti</footer>

<button class="share">Del listen 🎉</button>

<script>
  const SECTIONS = [
    { title: "Mad- & drikkeoplevelser", icon: "🍷", color: "#FF7A59", items: [
      { n: "Madlavningskursus", d: "Gerne fransk mad (fx saucer eller fiskeretter)", i: "🧑‍🍳" },
      { n: "Tør spansk rød-/hvidvin eller tysk Spätburgunder", d: "Spørg i vinhandlen", i: "🍷" },
      { n: "Irsk whiskey", d: "Redbreast eller Yellow Spot", i: "🥃" }
    ]},
    { title: "Diverse", icon: "🧦", color: "#4397FF", items: [
      { n: "Kompressionsstrømper", d: "Til løb", i: "🧦" },
      { n: "Toilettaske", d: "", i: "🧴" },
      { n: "Weekendtaske", d: "", i: "🧳" },
      { n: "Meyers hverdagsgrøntsager", d: "Bog", i: "📚" }
    ]}
  ];

  document.getElementById("sections").innerHTML = SECTIONS.map(s => `
    <section class="cat">
      <div class="cat-head" style="background:${s.color}">
        <span>${s.icon}</span> ${s.title} <span class="n">${s.items.length}</span>
      </div>
      <div class="items">
        ${s.items.map(it => `
          <article class="item">
            <div class="bubble">${it.i}</div>
            <div class="t">
              <h3>${it.n}</h3>
              ${it.d ? `<p>${it.d}</p>` : ""}
            </div>
            <a class="go" href="#">Se i butik</a>
          </article>`).join("")}
      </div>
    </section>`).join("");
</script>
</body>
</html>
