<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WishiCloud – POC B (Midnight)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0D1E33; --card:#172232; --line:#163255; --cream:#F9F2E6; --muted:#8B9098; --blue:#4397FF; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--cream); background: var(--navy);
    font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image: radial-gradient(900px 500px at 85% -10%, rgba(67,151,255,.18), transparent 60%);
    background-attachment: fixed;
  }
  .top {
    max-width: 1100px; margin: 0 auto; padding: 22px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { font-weight: 700; letter-spacing: -.02em; display: flex; gap: 8px; align-items: center; }
  .logo span { width: 28px; height: 28px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; font-size: 15px; }
  .share {
    font: inherit; font-weight: 600; font-size: 14px; color: var(--navy); cursor: pointer;
    background: var(--cream); border: 0; border-radius: 999px; padding: 9px 16px;
  }
  header.intro { max-width: 1100px; margin: 0 auto; padding: 40px 24px 36px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); font-weight: 600; margin: 0 0 14px; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: clamp(44px, 7vw, 84px); line-height: .98; letter-spacing: -.03em; margin: 0 0 18px;
  }
  .intro p { margin: 0; max-width: 560px; color: var(--muted); font-size: 18px; line-height: 1.5; }
  .stats { display: flex; gap: 28px; margin-top: 26px; font-size: 14px; color: var(--muted); }
  .stats b { display: block; font-size: 28px; color: var(--cream); font-family: Fraunces, Georgia, serif; font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px; }
  .cat { margin-bottom: 44px; }
  .cat h2 {
    font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; letter-spacing: -.02em;
    margin: 0 0 16px; display: flex; align-items: baseline; gap: 12px;
  }
  .cat h2 small { font-family: Geist, system-ui, sans-serif; font-size: 13px; color: var(--muted); font-weight: 500; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .row {
    display: flex; gap: 16px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    transition: border-color .2s;
  }
  .row:hover { border-color: var(--blue); }
  .thumb {
    flex: 0 0 92px; height: 92px; border-radius: 14px; display: grid; place-items: center; font-size: 40px;
    background: linear-gradient(135deg, #1E3A5F, #0D1E33);
  }
  .text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .text h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .text p { margin: 0; font-size: 14px; color: var(--muted); }
  .go { margin-top: 6px; color: var(--blue); font-weight: 600; font-size: 14px; text-decoration: none; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<nav class="top">
  <div class="logo"><span>☁</span> WishiCloud</div>
  <button class="share">Del ønskelisten</button>
</nav>

<header class="intro">
  <p class="eyebrow">Ønskeliste · Jul</p>
  <h1>Min ønskeliste</h1>
  <p>Ønsker gemmes, ikke glemmes. Her er de ting, der står højest på listen lige nu.</p>
  <div class="stats">
    <div><b id="total">0</b>ønsker</div>
    <div><b id="cats">0</b>kategorier</div>
  </div>
</header>

<main id="sections"></main>

<footer>WishiCloud — opdateret løbende.</footer>

<script>
  const SECTIONS = [
    { title: "Mad- & drikkeoplevelser", icon: "🍷", items: [
      { n: "Madlavningskursus", d: "Gerne fransk mad (fx saucer eller fiskeretter)", i: "🧑‍🍳" },
      { n: "Tør spansk rød-/hvidvin eller tysk Spätburgunder", d: "Spørg i vinhandlen", i: "🍷" },
      { n: "Irsk whiskey", d: "Redbreast eller Yellow Spot", i: "🥃" }
    ]},
    { title: "Diverse", icon: "🧦", items: [
      { n: "Kompressionsstrømper", d: "Til løb", i: "🧦" },
      { n: "Toilettaske", d: "", i: "🧴" },
      { n: "Weekendtaske", d: "", i: "🧳" },
      { n: "Meyers hverdagsgrøntsager", d: "Bog", i: "📚" }
    ]}
  ];

  document.getElementById("total").textContent = SECTIONS.reduce((a, s) => a + s.items.length, 0);
  document.getElementById("cats").textContent = SECTIONS.length;

  document.getElementById("sections").innerHTML = SECTIONS.map(s => `
    <section class="cat">
      <h2>${s.title} <small>${s.items.length} ønsker</small></h2>
      <div class="list">
        ${s.items.map(it => `
          <article class="row">
            <div class="thumb">${it.i}</div>
            <div class="text">
              <h3>${it.n}</h3>
              ${it.d ? `<p>${it.d}</p>` : ""}
              <a class="go" href="#">Se i butik →</a>
            </div>
          </article>`).join("")}
      </div>
    </section>`).join("");
</script>
</body>
</html>
